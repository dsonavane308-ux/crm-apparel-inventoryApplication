services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_inventory_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local